<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#202936">
  <title>ERP · 业务工作台</title>
  <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="static/style.css?v=20260916-r3-ui1">

</head>
<body>
  <aside class="module-rail" aria-label="业务模块">
    <button class="logo" data-module="home" aria-label="首页"><span>A</span></button>
    <nav id="module-nav"></nav>
    <button class="rail-collapse" id="rail-collapse" aria-label="收起菜单">☰</button>
  </aside>

  <header class="topbar">
    <div class="page-tabs" id="page-tabs"></div>
    <div class="top-actions">
      <button class="feature" id="contract-help">接口与维护说明</button>
      
      <button class="account" id="account-button"><span>账</span>登录 / 切换账号</button>
    </div>
  </header>

  <section class="module-menu" id="module-menu" aria-label="模块菜单"></section>
  <main id="workspace" class="workspace"><div class="loading"><i></i>正在加载业务工作台…</div></main>

  <dialog id="record-dialog" class="record-dialog">
    <form method="dialog" id="record-form">
      <header><div><small id="record-kicker">业务单据</small><h2 id="record-title">新建</h2></div><button value="cancel" class="dialog-close" aria-label="关闭">×</button></header>
      <div class="record-body" id="record-fields"></div>
      <footer><button value="cancel">取消</button><button type="button" class="primary" id="record-save">保存</button></footer>
    </form>
  </dialog>

  <dialog id="detail-dialog" class="detail-dialog">
    <form method="dialog">
      <header><div><small>单据详情</small><h2 id="detail-title">详情</h2></div><button value="cancel" class="dialog-close" aria-label="关闭">×</button></header>
      <div id="detail-body" class="detail-body"></div>
      <footer><button value="cancel" class="primary">关闭</button></footer>
    </form>
  </dialog>

  <dialog id="login-dialog" class="login-dialog">
    <form method="dialog">
      <div class="login-logo"><span>A</span><div><b>ERP 业务工作台</b><small>使用已授权账号登录</small></div></div>
      <label>登录账号<input id="login-app-id" type="text" autocomplete="username" required></label>
      <label>密码<input id="login-app-secret" type="password" autocomplete="current-password" required></label>
      <label hidden>岗位角色<select id="login-role"><option value="administrator">超级管理员</option><option value="operator">运营</option><option value="purchasing">采购</option><option value="warehouse">仓库</option><option value="finance">财务</option></select></label>
      <p id="login-error" role="alert"></p>
      <button type="button" class="primary" id="login-submit">进入工作台</button>
    </form>
  </dialog>

  <div id="toast-region" aria-live="polite"></div>

  <script defer src="static/fba-workflow.js?v=20260916-r2"></script>
